<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-400_700.woff2") format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-600.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-700.woff2") format("woff2"); font-weight: 700; }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1600px; height: 420px; overflow: hidden; position: relative;
    background: #0b0f1a; color: #fff; font-family: "Inter", sans-serif;
    display: flex; align-items: center; padding: 0 90px;
  }
  .glow {
    position: absolute; inset: -30%;
    background:
      radial-gradient(600px 300px at 12% 18%, rgba(245,194,107,.20), transparent 65%),
      radial-gradient(700px 340px at 82% 0%, rgba(58,123,255,.22), transparent 68%);
  }
  .grid {
    position: absolute; inset: 0; opacity: .35;
    background-image: linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(900px 420px at 30% 40%, #000 20%, transparent 80%);
  }
  .content { position: relative; z-index: 1; display: flex; align-items: center; gap: 64px; width: 100%; }
  .mark {
    width: 108px; height: 108px; border-radius: 28px; flex: none;
    background: linear-gradient(150deg, #1d2742, #0c1120);
    border: 1px solid rgba(245,194,107,.45);
    box-shadow: 0 0 0 1px rgba(0,0,0,.6) inset, 0 30px 60px -30px rgba(245,194,107,.5);
    display: grid; place-items: center;
    font-family: "Poppins"; font-weight: 700; font-size: 54px; color: #f5c26b;
  }
  h1 { font-family: "Poppins"; font-size: 58px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.06; }
  h1 span { color: #f5c26b; }
  .sub { margin-top: 18px; font-size: 23px; color: #b0b8c5; letter-spacing: .01em; }
  .meta { margin-top: 26px; display: flex; gap: 28px; font-size: 16px; color: #8d98ab; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; }
  .meta b { color: #cfd6e4; font-weight: 600; }
  .rule { width: 1px; height: 190px; background: linear-gradient(180deg, transparent, rgba(255,255,255,.18), transparent); }
  .right { margin-left: auto; text-align: right; }
  .right .big { font-family: "Poppins"; font-size: 64px; font-weight: 600; letter-spacing: -0.03em; color: #fff; }
  .right .big em { color: #f5c26b; font-style: normal; }
  .right p { margin-top: 10px; color: #8d98ab; font-size: 18px; }
</style>
</head>
<body>
  <div class="glow"></div><div class="grid"></div>
  <div class="content">
    <div class="mark">A</div>
    <div>
      <h1>Product engineering<br />that <span>ships</span>.</h1>
      <div class="sub">Web platforms · mobile apps · cloud · AI integration</div>
      <div class="meta"><span><b>Kathmandu</b>, Nepal</span><span>arviontech.net</span><span>hello@arviontech.net</span></div>
    </div>
    <div class="rule"></div>
    <div class="right">
      <div class="big">30 <em>open-source</em><br />projects</div>
      <p>Every demo runs in your browser.</p>
    </div>
  </div>
</body>
</html>
